# ~/.config/hypr/hypridle.conf

general {
    # Время в секундах до срабатывания первого обработчика
    lock_cmd = pidof hyprlock || hyprlock   # запускает блокировку, если ещё не запущена
    before_sleep_cmd = loginctl lock-session   # опционально: блокировка перед сном
    after_sleep_cmd = hyprctl dispatch dpms on   # включить экраны после пробуждения
}

listener {
    # Первый этап: блокировка через 5 минут
    timeout = 9000
    on-timeout = pidof hyprlock || hyprlock
}

