theme = "autumn"

[editor.cursor-shape]
insert = "bar"

[editor]
color-modes = true

[editor.statusline]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

left = ["mode", "spinner"]               
center = ["file-name"]                   
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"] 

[keys.normal]
"C-a" = "goto_line_start"
"C-e" = "goto_line_end"
